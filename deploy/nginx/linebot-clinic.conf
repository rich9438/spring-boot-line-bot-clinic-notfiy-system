# LINE Bot 反向代理設定
# 1. 將 bot.example.com 改為實際網域
# 2. 複製到 /etc/nginx/sites-available/ 並建立 sites-enabled 連結
# 3. 執行 certbot --nginx，certbot 會自動加入 443/SSL 設定與 HTTP→HTTPS 轉址

upstream linebot_clinic {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # LINE Webhook 請求很小，限制大小避免濫用
    client_max_body_size 1m;

    # 只開放 Webhook 端點，其餘路徑一律 404
    location = /callback {
        limit_except POST {
            deny all;
        }

        proxy_pass http://linebot_clinic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 簽章驗證依賴原始 body，不可緩衝改寫；LINE 要求在數秒內回應
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
